DEBUG: true                    # Whether to enable debug mode (prints additional information)

ENERGY_TEST: false              # Whether to perform energy test during swing-up (only applies if DEBUG is true)

DISTURBANCE_TEST: 
  ENABLED: false                 # Activates the pendulum XML tree for simulation testing. (Requires SIMULATION to be true)
  AUTO_START: false             # Whether to automatically start the next test with a lower striker angle (only applies if SIMULATION is true and DISTURBANCE_TEST is true)
  START_ANGLE: -24.1            # Starting angle for pendulum test in degrees (only applies if PENDULUM_TEST is true)

SPECIFICATION_TEST:
  ENABLED: false                # Meassures the rise-time, settling time and overshoot (only applies if SIMULATION is true)

GUI:
  ENABLED: false                 # Whether to enable the GUI (Only applies if VISUALIZE is false)
  UPDATE_RATE: 100              # GUI update rate in Hz (only applies if ENABLED is true)

UART:
  PORT: /dev/cu.usbmodem0E21E64D1
  BAUDRATE: 230400

QUBE:
  SIMULATION: true              # Whether to use MuJoCo simulation (true) or real hardware (false)
  VISUALIZE: true              # Whether to launch MuJoCo viewer (only applies if SIMULATION is true)
  SIMULATION_SPEED: 1.0         # 1.0 = real time, 0.5 = half speed

CONTROL:
  DT: 0.001                     # Control timestep [s] (1 kHz)
  DURATION: null                # Maximum simulation duration [s], set to null for unlimited
  MODERN_STABILIZATION: true    # Use modern stabilization method (true) or traditional method (false)
  
  # Voltage limits
  VOLTAGE_MAX: 10.0             # Maximum motor voltage [V]
  VOLTAGE_MIN: -10.0            # Minimum motor voltage [V]

PLANT:
  # Physical/simulation parameters (NOT CORRECT VALUES, MUST BE TUNED)
  MOTOR_CONSTANT: 0.04136       # Motor torque constant [Nm/V]
  TORQUE_CONSTANT: 0.04136      # Torque constant (same as motor constant for direct drive) [Nm/V]
  MOTOR_RESISTANCE: 7.63        # Motor resistance [Ohms]
  ARM_LENGTH: 0.085             # Distance from pivot to encoder axis [m]
  PENDULUM_LENGTH: 0.129        # Length of pendulum rod [m]
  ARM_MASS: 0.095               # Mass of arm [kg]
  PENDULUM_MASS: 0.024          # Mass of pendulum [kg]
  GRAVITY: 9.816                # Gravitational acceleration [m/s^2]

DATA:
  LOGGING: true                 # Whether to log data for plotting
  PLOTTING: true                # Whether to enable plotting after simulation (Requires LOGGING to be true)
